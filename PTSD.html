<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PTSD의 특성과 치료적 개입</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
:root{--bg:#eef2f4;--ink:#1b2a3a;--mut:#5b6b7a;--ac:#1f6f78;--ac2:#e3eef0;--warn:#a8541a;--wbg:#f6e9de;--ln:#c9d4da;--u:clamp(12px,1.5vmin + .3vw,17px);--h:0px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14202b;--ink:#e6edf2;--mut:#9fb0bd;--ac:#6cc3cc;--ac2:#1d3340;--warn:#f0a56b;--wbg:#3a2b20;--ln:#2e4252}}
:root[data-theme=dark]{--bg:#14202b;--ink:#e6edf2;--mut:#9fb0bd;--ac:#6cc3cc;--ac2:#1d3340;--warn:#f0a56b;--wbg:#3a2b20;--ln:#2e4252}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
#s{height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:calc(4vh + 3.3*var(--u) + var(--h)) 5vw 9vh;max-width:1000px;font-size:clamp(14px,2.1vmin + .6vw,26px);line-height:1.6}
h1{font-family:'Noto Serif KR',serif;font-size:1.7em;line-height:1.3;margin:0 0 .6em;padding-left:.6em;border-left:.2em solid var(--ac)}
.cover h1{font-size:2.8em;border:0;padding:0}
.sub{color:var(--ac);font-size:1.3em;margin:0 0 2em}
.q{font-family:'Noto Serif KR',serif;background:var(--ac2);border-radius:.3em;padding:.7em 1em;margin:.45em 0;font-size:1em}
.q.em{font-weight:700;border-left:.2em solid var(--ac)}
.w{background:var(--wbg);color:var(--warn);font-weight:700;border-radius:.3em;padding:.7em 1em;margin:.45em 0}
.f{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;margin:.6em 0}
.f span{background:var(--ink);color:var(--bg);padding:.35em .8em;border-radius:2em;font-size:.9em}
.f i{font-style:normal;color:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:.7em;margin:.5em 0}
.g div,li{font-size:.92em}
.g div{border:1px solid var(--ln);border-radius:.3em;padding:.6em .9em}
b{color:var(--ac)}
ul{margin:.4em 0;padding-left:1.2em}li{margin:.25em 0}
.n{color:var(--mut);font-size:.72em;border-top:1px solid var(--ln);margin-top:.9em;padding-top:.5em}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:.2em;padding:calc(.5em + env(safe-area-inset-top,0px)) 1em .5em;border-bottom:1px solid var(--ln);background:var(--bg);z-index:3;font-size:clamp(12px,1.5vmin + .3vw,17px);overflow-x:auto}
#top button,#toc button,#sub button{all:unset;cursor:pointer;color:var(--mut);line-height:1.35}
#top button{padding:.35em .9em;border-radius:2em;white-space:nowrap}
#top button.on{background:var(--ac);color:var(--bg);font-weight:700}
#toc,#sub{position:fixed;left:0;right:0;display:none;gap:.3em;padding:.4em 1em;border-bottom:1px solid var(--ln);z-index:2;font-size:var(--u);overflow-x:auto;background:var(--bg);box-sizing:border-box}
#toc{top:calc(3.3*var(--u) + env(safe-area-inset-top,0px))}
#sub{top:calc(6*var(--u) + env(safe-area-inset-top,0px));background:var(--ac2)}
#toc.show,#sub.show{display:flex}
#toc button,#sub button{white-space:nowrap;flex:none;padding:.25em .8em;border-radius:.3em}
#toc button.on{background:var(--ac2);color:var(--ac);font-weight:700}
#toc button.na{opacity:.5}
#sub button.on{background:var(--ink);color:var(--bg);font-weight:700}
#top button:focus-visible,#toc button:focus-visible,#sub button:focus-visible{outline:2px solid var(--ac)}
.sp{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:.7em;margin:.6em 0}.sp.ar{gap:1.3em}
.c{flex:1 1 10em;min-width:0;border:1px solid var(--ln);border-top:.25em solid var(--ac);border-radius:.3em;padding:.5em .8em;font-size:.82em;line-height:1.5;position:relative}
.c h3{margin:0 0 .25em;font-size:1em;color:var(--ac)}.c.bad{border-top-color:var(--warn)}.c.bad h3{color:var(--warn)}
.sp.ar>.c:not(:last-child)::after{content:'➔';position:absolute;right:-1.15em;top:50%;transform:translateY(-50%);color:var(--ac)}
.ch{display:flex;flex-wrap:wrap;gap:.4em;margin:.6em 0}.ch span{background:var(--ac2);padding:.2em .75em;border-radius:2em;font-size:.82em}
.big{font-family:'Noto Serif KR',serif;font-size:2.6em;font-weight:700;color:var(--ac);line-height:1.1}
.bars{margin:.6em 0}.br{display:grid;grid-template-columns:8.5em 1fr;gap:.7em;align-items:start;margin:.7em 0}
.br>span{padding-top:.35em;font-weight:700}.tr i{display:block;box-sizing:border-box;background:var(--ac);color:var(--bg);font-style:normal;font-weight:700;border-radius:.3em;padding:.3em .7em;white-space:nowrap;font-size:1.05em}
.tr i.bad{background:var(--warn)}.tr small{display:block;color:var(--mut);font-size:.72em;margin-top:.25em}
@media(max-width:640px){.br{grid-template-columns:1fr}}
.r5{gap:.7em}.r5>.c{font-size:.74em}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:.6em .7em;margin:.45em 0}.qs>.q{margin:0}.qs>.q:last-child:nth-child(odd){grid-column:1/-1}
.g{align-items:stretch}.g.n5{grid-template-columns:repeat(6,1fr)}.g.n5>div{grid-column:span 2}.g.n5>div:nth-child(n+4){grid-column:span 3}
.pt{text-align:center;margin:.5em 0}.pt span{display:inline-block;background:var(--ac2);color:var(--ink);border:1px solid var(--ac);border-radius:2em;padding:.3em 1.1em;font-size:.88em;font-weight:700}.pt b{color:var(--warn);font-size:1.1em}.pt span::before{content:'◆';color:var(--ac);margin-right:.6em;font-size:.8em}
.sm{font-size:.75em;color:var(--mut);margin:.3em 0 .5em}
.col .qs,.col .sp,.col .g,.col .g.n5{grid-template-columns:1fr}.col .g.n5>div,.col .g.n5>div:nth-child(n+4){grid-column:auto}.col .sp.ar>.c::after{display:none}
@media(max-width:820px){.r5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.sp,.r5,.qs,.g.n5{grid-template-columns:1fr}.g.n5>div,.g.n5>div:nth-child(n+4){grid-column:auto}.sp.ar>.c::after{display:none}}
.rp{height:2.3em;width:auto}.rpt{justify-content:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1em;align-items:center}@media(max-width:640px){.two{grid-template-columns:1fr}}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7em;margin:.5em 0}.r3 .c{font-size:.82em}
.bx{border:1px solid var(--ln);border-radius:.3em;padding:.6em .9em;font-size:.92em}.r3>.bx{font-size:.88em}
.lb{font-weight:700;color:var(--ac);font-size:.85em;margin:.6em 0 0}
@media(max-width:640px){.r3{grid-template-columns:1fr}}
#s.sm2{font-size:clamp(12px,1.55vmin + .45vw,19px)}
.bx.mg{margin-top:.7em;text-align:center;background:var(--wbg);border-color:var(--warn);color:var(--warn)}.bx.mg b{color:var(--warn);font-size:1.05em}
.q,.qs>.q,.w{font-size:clamp(12px,1.5vmin + .45vw,19px)}
#bar{position:fixed;left:0;bottom:0;height:.4vh;min-height:3px;background:var(--ac);transition:width .3s}
#nav{position:fixed;right:max(1rem,3vw);bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:flex;gap:.5rem;align-items:center;font-size:14px;color:var(--mut)}
#nav button{background:var(--ac);color:var(--bg);border:0;border-radius:2em;width:2.6em;height:2.6em;font-size:16px;cursor:pointer}
#nav button:focus-visible{outline:3px solid var(--ink)}
@media(max-width:640px){.g{grid-template-columns:1fr}#s{padding:3vh 6vw 12vh}}
</style></head><body>
<main id="s" aria-live="polite"></main>
<nav id="top" aria-label="대목차"></nav><nav id="toc" aria-label="세부 목차"></nav><nav id="sub" aria-label="회복의 5단계"></nav>
<div id="bar"></div>
<div id="nav"><span id="c"></span><button id="p" aria-label="이전">◀</button><button id="x" aria-label="다음">▶</button></div>
<script>
const Q=(a,e)=>`<div class="qs">${a.map((t,i)=>`<div class="q${e&&i===e-1?' em':''}">“${t}”</div>`).join('')}</div>`;
const L=a=>`<ul>${a.map(t=>`<li>${t}</li>`).join('')}</ul>`;
const F=a=>`<div class="f">${a.map((t,i)=>(i?'<i>➔</i>':'')+`<span>${t}</span>`).join('')}</div>`;
const G=a=>`<div class="g${a.length===5?' n5':''}">${a.map(t=>`<div>${t}</div>`).join('')}</div>`;
const W=t=>`<div class="w">${t}</div>`;
const N=t=>`<div class="n">${t}</div>`;
const S=[
`<div class="cover"><h1>PTSD의 특성과 치료적 개입</h1><p class="sub">회복의 단계에 따른 위기개입</p><p>한국상담대학원대학교 박주원</p></div>`,
`<h1>배경: 외상은 사건이 아니라 ‘과정’이다</h1>${Q(['정신적 외상은 하나의 과정으로 이 과정은 개인에게 갑작스럽고도 저항하기 어려운 위협이 되는 사건에서 비롯된다.','이러한 사건이 발생했을 때 마음의 내적 작용은 혼란을 조절하지 못하고 불평형이 일어난다.','이러한 외상상태는 개인이 외상사건을 재조직하고 분류, 이해할 수 있을 때까지 계속된다.'],1)}`,
`<h1>배경: 통합되지 않은 외상은 다시 나타난다</h1>${F(['외상사건','평형 붕괴','외상상태','재조직·통합','평형 회복'])}${Q(['만일 외상을 의식수준에서 효과적으로 통합시키고 외상을 과거의 일부로 조직할 수 있다면 항상성을 되찾고, 문제에 대처하며, 다시 일상적인 생활을 계속할 수 있게 될 것이다.','사건을 효과적으로 통합하지 못하고 의식 수준 아래로 가라앉히면 초기의 스트레스원이 사건 몇 달 후, 또는 몇 년 후에 다양한 증상으로 다시 나타날 수 있다.','시간이 지난 후 외상후 증상이 나타나거나 노화와 함께 이전의 증상이 악화된다는 많은 증거를 2차 세계대전의 퇴역군인들에게서 찾을 수 있다.'])}`,
`<h1>PTSD의 역동: 진단 (DSM-5-TR)</h1>${Q(['실제적이거나 위협적인 죽음이나 심각한 상해, 또는 자신이나 타인의 신체적 안녕을 위협하는 외상 사건에 노출되어야 한다.'],1)}${G(['<b>침습적 사고</b><br>고통스러운 회상, 악몽, 플래시백 (재경험)','<b>회피</b><br>외상 관련 생각·느낌과 외부 단서의 지속적 회피','<b>부정적 인지·기분의 변화</b><br>부정적 믿음, 자책, 위축, 둔감화, 소원함','<b>각성·반응성의 변화</b><br>과각성, 분노 폭발, 과도한 놀람, 수면·집중 장애'])}<div class="pt"><span>위 네 가지 장해의 기간이 <b>1개월</b>을 넘어야 한다.</span></div>${Q(['장해가 사회적·직업적 또는 다른 중요한 기능 영역에서 임상적으로 현저한 고통이나 손상을 초래한다.'])}${N('교재(DSM-IV)는 재경험·회피·과각성의 3개 증상군. DSM-5부터 4개 증상군이며, 사건 당시의 공포·무력감(A2)은 필수 조건에서 삭제되었다.')}`,
`<h1>PTSD의 역동: 위기개입에서의 외상력 확인</h1>${Q(['따라서 우리의 의견은 진단이 무엇이든지 위기개입의 사정에서는 이전에 외상에 노출된 적이 있는지 알아보아야 한다.','그러나 PTSD로 고통 받게 될 것을 예견할 수 있는 절대적인 요인은 없다. 누구라도 가능성이 있는 것이다.'],1)}`,
`<h1>PTSD의 역동: 생리학적 반응과 기억</h1>${Q(['외상 사건이 중단되어 위험이 사라지고 더 이상 위기를 전제로 신체체계가 기능할 필요가 없어도 스트레스가 지속될 때 신경체계는 위기가 지속되는 것처럼 고양되고 활동적으로 작용할 것이다.','또한 환경 자극에 의해서 유사한 각성 상태가 이루어졌을 때만 기억이 가능하다.'])}${N('각성 상태와 외상 기억이 연결되어 있으므로, 이완 상태에서의 접근이 치료의 출발점이 된다.')}`,
`<h1>발병률과 외상의 잔재</h1>${Q(['미국 일반 인구의 평생유병률은 8%이다.','위험군을 대상으로 한 연구에서 PTSD의 발병률은 매우 높아진다.','뛰어난 대처능력과 올바른 합리적·인지적 행동패턴, 긍정적 사회적 지지체계를 지닌, 통합이 잘 이루어진 사람에게도 외상사건의 잔재들은 좀처럼 사라지지 않는다.'])}`,
`<h1>외상 유형의 중요성과 영향요인</h1>${Q(['인간이 만들어낸 외상 중에서도 그것이 직접적으로 가족의 사회적 지지체계에 영향을 미칠 때 PTSD의 희생자는 더 많아진다.','생명 위협의 정도, 사별의 대상, 발병 속도, 외상의 지속기간, 가정의 연속성을 해치는 변화의 정도, 재발 가능성, 죽음이나 파괴 등에 노출된 정도, 상황 자체에 존재하는 윤리적 갈등의 정도, 외상에서 자신의 역할, 영향을 받는 지역의 비율 정도'])}`,
`<h1>침입적 사고, 정서적 마비, 신경각성, 해리</h1>${Q(['시간이 지나면서 침입적 사고는 외상과 관계가 없어 보이는 작고도 더욱 일반적인 자극과 연관된다.','감정을 의식의 범위 밖에 묻어버린다고 그것이 사라지는 것은 아니다.','외상 순간에 해리를 경험하는 것은 PTSD를 장기적으로 예견할 수 있는 중요한 변수이다.'],2)}${N('DSM-5-TR의 PTSD 증상군 ① 침입 ② 회피 ③ 부정적 인지 및 기분의 변화 ④ 각성과 반응성의 변화')}`,
`<h1>외상은 개인에게만 머물지 않는다</h1>${F(['외상 경험','개인','가족','사회적 지지체계'])}${Q(['외상사건에서 회복을 가능하게 하는 중요한 시금석은 가족이 기본이 되는 강한 지지체계이다.','요컨대, 외상의 희생자를 치료한다는 것은 곧 가족을 치료한다는 것을 의미한다.'],2)}`,
`<h1>PTSD의 부적응 유형</h1>${G(['<b>죽음의 각인</b><br>“외상을 경험하는 것은 자신의 실제 생물학적 의미에서의 죽음을 생생하게 상상해볼 수 있게 한다.”','<b>생존자로서의 죄책감</b><br>“다른 사람은 살아남지 못했는데 자신은 살아남았다는 죄책감”','<b>둔감화</b><br>“내면에서 요동치는 이러한 강한 상반되는 감정의 변화 때문에 전혀 안정을 찾지 못하는”','<b>소원함</b><br>“앞으로의 모든 관계는 가짜일 것이라는 감정이다.”','<b>정서적 어려움</b><br>“삶에서 어떤 의미도 찾지 못하는 것이다.”'])}`,
`<h1>사정: 치료의 출발점</h1>${Q(['많은 다른 증상과 문제 때문에 PTSD를 제대로 볼 수 없다는 점에서 PTSD에 있어서 사정은 특히 중요하다.','이전의 외상에 대한 정밀한 탐색을 하지 않는다면 약물남용이나 다양한 인격장애와 같은 현재의 진단이 PTSD를 감출 수 있다.','높은 수준의 신뢰가 형성되기 전에는 문제의 소인에 대해 다루거나 해석하거나 심지어는 추측해서도 안 된다.','결국 사정은 PTSD의 치료과정에서 계속적으로 이루어져야 한다.'],4)}<div class="lb">사정의 방법</div><div class="r3"><div class="c"><h3>구조화된 면접</h3></div><div class="c"><h3>자기보고</h3></div><div class="c"><h3>실험/관찰에 의해 도출된 척도</h3></div></div>${N('맥락적 변수: 성, 인종, 사회경제적 상황, 문화, 종교, 이전 외상 노출 빈도, 대인관계상의 강점, 리질리언스 등')}`,
`<h1>회복의 5단계</h1>${F(['1. 응급·절규','2. 침입·반복','3. 마비·부인','4. 반성·전이','5. 통합'])}${L(['<b>응급:</b> 싸우거나 도망가는 반응, 안도감과 함께 혼란·두려움·무력감','<b>침입·반복:</b> 악몽, 침입적 이미지, 감정의 급격한 변화, 과도한 놀람','<b>마비·부인:</b> 외상 경험을 의식에서 밀어내 불안을 일시적으로 감소','<b>반성·전이:</b> 미래 지향적이고 긍정적인 관점을 발전시키며 외상에 직면','<b>통합:</b> 외상을 현재를 지배하는 사건이 아닌 과거의 경험으로 자리매김'])}${N('선형적 과정이 아니다. 새로운 위기가 발생하면 회피 ➔ 회상 ➔ 회복 ➔ 다시 회피의 순환이 반복될 수 있다.')}`,
`<h1>초기 개입: 왜 빨라야 하는가</h1>${Q(['외상으로 인한 불평형이 가라앉은 후에는 재조직화가 일어난다.','이 재조직화는 적응적일 수도 있고 부적응적일 수도 있다. 따라서 부적응적인 재조직화가 형성되기 전에 개입하는 것이 중요하다.','“스스로 해결해야 한다”고 생각하여 초기 개입을 거부할 수 있다. 이러한 잘못된 믿음 때문에 장애가 지속되고 전문적인 치료가 필요한 상태로 발전할 수 있다.'])}`,
`<h1>수용의 중요성</h1>${Q(['휴먼서비스 워커는 희생자가 외상에 대한 이야기를 시작하고 외상에 직면할 수 있도록 수용적 분위기를 조성해주어야 한다.','클라이언트는 워커에게는 없는 경험적 지식이 있다. 워커는 클라이언트에게는 없는 임상적이고 기술적인 지식이 있다. 따라서 클라이언트와 워커는 함께 작업 동맹을 맺을 수 있다.','잔혹한 행위를 묘사하는 클라이언트에게 정서적 혐오를 나타내지 않도록 주의한다. 비심판적이고 객관적이 되어야 한다.'])}${L(['과장된 정체성을 심어주거나 영웅화를 경계한다','소진의 신호에 주의한다'])}`,
`<h1>치료의 위험</h1>${Q(['치료에 내재된 위험을 명확히 언급하는 일은 휴먼서비스 워커의 의무이기도 하다.','회복은 부분적으로만 일어날 수도 있다. 그 오랜 지독한 문제에 마술적 치료방법이란 없다.','희생자가 괴로운 기억과 감정을 재경험하면서 참기 힘든 수준의 정신적 고통을 겪을 수 있다.','죄책감, 슬픔, 후회를 포함하여 자신을 수용하는 것은 PTSD를 해결하는 데 필수조건이다.'],1)}`,
`<h1>개인에 대한 개입</h1>${Q(['개인치료는 집단치료와 병행한다. 위기단계에서 행동치료와 인지-행동치료를 다양하게 조합한 다중적 치료 접근을 사용한다.','복잡한 질병에는 절충적인 치료와 절충적인 치료계획이 가장 적절하다.','그러나 아직까지는 PTSD만을 위한 정해진 향정신성 약물군은 없다.','PTSD 치료가 성공적으로 이루어지기 위해서는 신중한 처방과 향정신성 약물치료의 효과를 관찰하여야 한다.'])}`,
`<h1>응급·절규: 불안 경감</h1>${Q(['회복의 첫 단계인 응급 또는 절규의 단계에서 가장 중요한 문제는 생존자를 안정시키는 것이다.','명상이나 근육이완, 혹은 최면술이나 바이오피드백을 사용할 수 있다.','근육이완만으로도 현재의 증상을 경감시키고 감정이나 행동 조절력을 회복할 수 있도록 도울 수 있다.'],1)}`,
`<h1>침입적 이미지의 소멸</h1>${Q(['오치버그(Ochberg, 1988)는 PTSD를 자율신경계(ANS)의 각성으로 보아야 하며, 치료 시에도 이 장애의 생리학적 측면을 고려해야 한다고 결론내렸다.','클라이언트가 끔찍하고 불안이 야기되는 이미지에서 벗어나 안정되고 편안한 장면에 집중할 수 있도록 지속적으로 돕는다.'])}${F(['이완 훈련','심상 훈련','편안한 장면에 집중'])}${N('긴장완화 방법: 체계적 둔감화, 드러냄, 범람법, 내적 감정의 폭발, 게슈탈트기법 등')}`,
`<h1>감정적 마비·부인</h1>${Q(['이 단계에서는 외상적 사건을 의식화하고 희생자가 부인하는 숨겨진 사실과 감정을 인식하는 것에 관심을 가진다.','휴먼서비스 워커는 희생자가 충분히 이완되었을 때 끔찍한 외상사건을 재경험하도록 한다.','긴밀한 라포가 형성되고 상호 신뢰가 형성되었을 때 적극적으로 해석하고 클라이언트의 이야기 내용을 명료화할 수 있다.','감당할 수 있을 정도의 회상법을 사용하여 클라이언트가 상상이 아닌 실제의 사건을 인식할 수 있도록 돕는다.'],1)}`,
`<h1>반성과 전이: 범람법</h1>${Q(['클라이언트에게 힘든 일일 수 있지만 휴먼서비스워커는 클라이언트가 그 사건에 대한 이해와 함께 외상사건 당시에 느꼈던 감정적 반응을 경험할 수 있도록 한다.','범람법은 두려움을 일으키는 자극을 계속 가하는 것이다. 계속적인 자극은 불안을 야기하는 자극을 경감시킨다.'],1)}${W('⚠️ 이러한 기법은 매우 위험한 치료적 시도로서 경험 없는 미숙한 상담가는 충분한 훈련을 받기 전에는 사용할 수 없다.')}`,
`<h1>반성과 전이: 사고정지</h1>${F(['침입적 사고','“그만!”','긍정적·자기증진적 사고'])}${Q(['사고정지는 매우 단순하지만 강력한 방책으로, 희생자에게 휴먼서비스 워커의 도움을 받아 자신을 힘들게 하는 침입적인 사고를 자기증진을 꾀하게 하는 사고로 변하게 하는 것이다.'])}`,
`<h1>반성과 전이: 일지쓰기</h1>${Q(['일지는 감정을 여는 좋은 방법이고 비언어적인 정화작용이 일어나도록 한다.','자신의 생각을 말로 적어보고 또 들어봄으로써 희생자는 그 끔찍한 기억을 안전한 심리적 거리에 놓을 수 있게 되며, 클라이언트와 워커는 함께 그 기억을 분석할 수 있게 된다.','생기 있는 죄책감은 희생자가 과거의 행동에 책임질 수 있도록 하며 새로운 차원의 개인적인 자유를 경험케 한다.'])}`,
`<h1>통합: 게슈탈트기법</h1>${Q(['게슈탈트기법은 희생자들의 과거에 접근하여, 실천가들이 미해결과제(unfinished business)라고 일컫는 것을 인식의 수준으로 끌어올리는 기법으로서 외상사건의 곪은 상처를 짜내는 데 특히 도움을 준다.','그 끔찍한 날에 거기 있던 각각의 사람들과 빌리 맥이 화해할 수 있을 때까지 미해결된 과제를 천천히 그리고 인내심을 가지고 훈습했다.','확실히 빌리 맥은 고통스러워하겠지만 그 사건을 과거로 돌려보내기 위해서는 애도의 과정이 필요하다.'])}`,
`<h1>통합과 추후 관리</h1>${Q(['빌리 맥이 과거의 지난날에 대해 속죄하면서 외상은 사라진다.','휴먼서비스 워커는 빌리가 현재로 돌아와 그의 삶을 향해 나아갈 수 있도록 돕는다.','집중적인 개입을 늦추고 필요에 따라 개입의 효과를 증진시킬 수 있는 추후 회기가 필요하다.','이 지점이 바로 통합의 시기로 위기에서 회복하는 다섯 번째 단계라고 할 수 있다.'],4)}`];

S[2]=`<h1>배경: 통합되지 않은 외상은 다시 나타난다</h1>${R([C('통합','“외상을 과거의 일부로 조직할 수 있다면”'),C('평형 회복','“항상성을 되찾고, 문제에 대처하며, 다시 일상적인 생활을 계속할 수 있게 될 것이다.”')],1)}${R([C('통합 실패','“의식 수준 아래로 가라앉히면”','bad'),C('증상으로 재출현','“사건 몇 달 후, 또는 몇 년 후에 다양한 증상으로 다시 나타날 수 있다.”','bad')],1)}${Q(['시간이 지난 후 외상후 증상이 나타나거나 노화와 함께 이전의 증상이 악화된다는 많은 증거를 2차 세계대전의 퇴역군인들에게서 찾을 수 있다.'])}`;
S[5]=`<h1>PTSD의 역동: 생리학적 반응과 기억</h1>${R([C('위험이 사라짐','“외상 사건이 중단되어 위험이 사라지고”'),C('스트레스 지속','“더 이상 위기를 전제로 신체체계가 기능할 필요가 없어도 스트레스가 지속될 때”'),C('신경체계 고양','“신경체계는 위기가 지속되는 것처럼 고양되고 활동적으로 작용할 것이다.”','bad')],1)}${Q(['또한 환경 자극에 의해서 유사한 각성 상태가 이루어졌을 때만 기억이 가능하다.'],1)}`;
S[6]=`<h1>발병률과 외상의 잔재</h1><div class="bars"><div class="br"><span>일반 인구</span><div class="tr"><i style="width:30.8%">8%</i><small>“미국 일반 인구의 평생유병률은 8%이다.”</small></div></div><div class="br"><span>베트남 퇴역군인</span><div class="tr"><i class="bad" style="width:100%">26% · 약 960,000명</i><small>“대략 26%인 약 960,000명의 베트남 퇴역군인이 PTSD의 증상을 가지고 있었다.”</small></div></div></div>${Q(['뛰어난 대처능력과 올바른 합리적·인지적 행동패턴, 긍정적 사회적 지지체계를 지닌, 통합이 잘 이루어진 사람에게도 외상사건의 잔재들은 좀처럼 사라지지 않는다.'],1)}`;
S[7]=`<h1>외상 유형의 중요성과 영향요인</h1>${Q(['인간이 만들어낸 외상 중에서도 그것이 직접적으로 가족의 사회적 지지체계에 영향을 미칠 때 PTSD의 희생자는 더 많아진다.'],1)}${(()=>{const A=['생명 위협의 정도','사별의 대상','발병 속도','외상의 지속기간','가정의 연속성을 해치는 변화의 정도'],B=['재발 가능성','죽음이나 파괴 등에 노출된 정도','상황 자체에 존재하는 윤리적 갈등의 정도','외상에서 자신의 역할','영향을 받는 지역의 비율 정도'];

S[8]=`<h1>DSM-5-TR의 PTSD 증상군</h1>${G(['<b>1. 침습적 사고</b><br>“외상후스트레스장애의 침습적인 기억은 우울성 반추와는 달리 오직 불수의적이고 침습적이며 고통스러운 기억에만 한정된다는 점에서 구별된다.”','<b>2. 회피</b><br>“개인은 생각, 기억, 느낌을 피하기 위하여 보통 신중한 노력을 하고, 그 사건의 기억을 떠오르게 하는 활동, 대화, 물체, 상황, 또는 사람들을 피한다.”','<b>3. 부정적 인지·기분의 변화</b><br>“기분의 부정적 변화는 다양한 형태를 취할 수 있으며, 외상성 사건의 핵심적이고 감정적으로 고통스러운 부분을 기억하지 못하는 무능력을 포함한다.”','<b>4. 각성·반응성의 변화</b><br>“외상후스트레스장애를 가진 사람의 자율신경계의 과잉 각성은 전혀 위험스럽지 않은 자극을 구별하지 못하게 한다.”'])}${N('American Psychiatric Association. (2023). DSM-5-TR 정신질환의 진단 및 통계 편람(제5판 수정판) (권준수, 김붕년, 김재진, 신민섭, 신일선, 오강섭, 원승희, 이상익, 이승환, 이헌정, 정영철, 조현상, 김민아 역). 학지사.')}`;
S[12]=`<h1>초기 개입: 왜 빨라야 하는가</h1>${F(['외상 사건','불평형이 가라앉음','재조직화'])}${Q(['부적응적인 재조직화가 형성되기 전에 개입하는 것이 중요하다.'],1)}${W('⚠️ “사건을 다루는 것이 너무 어렵다고 보거나” 혹은 “그 사건에 스스로 대처해야 한다고 믿기 때문”에 “장애가 지속”될 수 있다.')}`;
S[13]=`<h1>수용의 중요성</h1><div class="f"><span>클라이언트<br>경험적 지식</span><i>＋</i><span>워커<br>임상적·기술적 지식</span><i>＝</i><span>작업 동맹</span></div>${Q(['휴먼서비스 워커는 희생자가 외상에 대한 이야기를 시작하고 외상에 직면할 수 있도록 수용적 분위기를 조성해주어야 한다.','잔혹한 행위를 묘사하는 클라이언트에게 정서적 혐오를 나타내지 않도록 주의한다. 비심판적이고 객관적이 되어야 한다.'],1)}${H(['반대 성의 치료자가 역할 모델이 될 수 있음','과장된 정체성·영웅화 경계','소진의 신호에 주의'])}`;
S[14]=`<h1>치료의 위험</h1>${Q(['치료에 내재된 위험을 명확히 언급하는 일은 휴먼서비스 워커의 의무이기도 하다.'],1)}<div class="r3"><div class="bx"><b>부분적 회복</b><br>“회복은 부분적으로만 일어날 수도 있다.”</div><div class="bx"><b>직업 유지의 어려움</b><br>“직업 유지에 어려움이 초래될 수도 있다.”</div><div class="bx"><b>고통의 재경험</b><br>“참기 힘든 수준의 정신적 고통을 겪을 수 있다.”</div></div><div class="bx mg"><b>마술적 치료는 없음</b></div>${Q(['죄책감, 슬픔, 후회를 포함하여 자신을 수용하는 것은 PTSD를 해결하는 데 필수조건이다.'])}`;
S[16]=`<h1>회복의 5단계</h1>${R([C('1. 응급·절규','싸우거나 도망가는 반응, 두려움·무력감'),C('2. 마비·부인','잠재의식적 기억 속에 경험을 묻어버리면서 일시적으로 불안이나 스트레스 증상 감소'),C('3. 침입·반복','악몽, 침입적 이미지, 감정의 급격한 변화'),C('4. 반성·전이','미래 지향적이고 긍정적인 관점, 외상에 직면'),C('5. 통합','외상을 과거의 자리에 돌려놓고 삶에 대한 연속성의 느낌 회복')]).replace('class="sp"','class="sp r5"')}<div class="f rpt">${RP(0)}<span>회피</span><i>➔</i><span>회상</span><i>➔</i><span>회복</span>${RP(1)}</div>${N('핵심 이슈가 해결되기 전까지는 회피와 회상과 회복, 그리고 더 많은 회피의 순환적 패턴이 반복될 것이다.')}`;
S[20]=`<h1>반성과 전이: 범람법</h1><div class="two"><div>${Q(['범람법은 두려움을 일으키는 자극을 계속 가하는 것이다. 계속적인 자극은 불안을 야기하는 자극을 경감시킨다.'],1)}</div><div><svg viewBox="0 0 240 130" role="img" aria-label="자극 노출이 계속되면 불안이 줄어드는 그래프" style="width:100%"><path d="M25 10V105H230" fill="none" style="stroke:var(--mut)" stroke-width="1.5"/><path d="M28 18C70 22 90 92 225 100" fill="none" style="stroke:var(--ac)" stroke-width="3"/><text x="30" y="124" style="fill:var(--mut)" font-size="11">자극에 계속 노출</text><text x="4" y="12" style="fill:var(--mut)" font-size="11">불안</text></svg></div></div>${W('⚠️ 이러한 기법은 매우 위험한 치료적 시도로서 경험 없는 미숙한 상담가는 충분한 훈련을 받기 전에는 사용할 수 없다.')}`;
S[23]=`<h1>통합: 게슈탈트기법</h1>${F(['미해결과제','인식의 수준으로','화해','애도','과거로'])}${Q(['게슈탈트기법은 희생자들의 과거에 접근하여, 실천가들이 미해결과제(unfinished business)라고 일컫는 것을 인식의 수준으로 끌어올리는 기법으로서 외상사건의 곪은 상처를 짜내는 데 특히 도움을 준다.','그 끔찍한 날에 거기 있던 각각의 사람들과 빌리 맥이 화해할 수 있을 때까지 미해결된 과제를 천천히 그리고 인내심을 가지고 훈습했다.','그 사건을 과거로 돌려보내기 위해서는 애도의 과정이 필요하다.'])}`;
